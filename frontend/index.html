<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5b24" />
    <meta name="description" content="大学生期末复习、题库生成与智能刷题平台" />
    <title>期末不挂科｜AI 智能刷题系统</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('final-exam-helper-theme')
          const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system'
          const systemDark = matchMedia('(prefers-color-scheme: dark)').matches
          const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
